<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DebitHub — Definir nova senha.">
  <title>Redefinir senha — DebitHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>
<body>

<div id="toast-container"></div>

<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-container">

    <div class="login-brand animate-up">
      <div class="brand-logo-full brand-logo-full-lg" role="img" aria-label="DebitHub">
        <img class="brand-logo-img-light" src="img/logo-debithub-horizontal-claro.png" alt="">
        <img class="brand-logo-img-dark" src="img/logo-debithub-horizontal-escuro.png" alt="">
      </div>
    </div>

    <div class="login-page-toolbar animate-up" style="animation-delay:.05s">
      <select class="toolbar-select" data-lang-select>
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
      <button class="toggle-theme-btn" onclick="DH.ui.toggleTheme()" data-icon="sun"></button>
    </div>

    <div class="login-card animate-up" style="animation-delay:.1s">
      <div class="tab-content" style="padding:1.5rem;">

        <h2 style="margin-bottom:.4rem;" data-i18n="reset_password_title">Definir nova senha</h2>
        <p class="text-small text-muted" style="margin-bottom:1.25rem;" data-i18n="reset_password_desc">
          Escolha uma nova senha para sua conta.
        </p>

        <div id="reset-invalid" class="hidden" style="margin-bottom:1rem;">
          <p class="text-small" style="color:var(--danger);" data-i18n="reset_link_invalid">
            Este link de redefinição é inválido ou expirou. Solicite um novo.
          </p>
          <a href="index.html" class="btn btn-ghost w-full" style="margin-top:.75rem;" data-i18n="back_login">Voltar para o login</a>
        </div>

        <form id="reset-password-form" novalidate>
          <div class="form-group">
            <label class="form-label" data-i18n="field_new_password">Nova senha</label>
            <div class="input-group">
              <input type="password" class="form-input" id="reset-new-password"
                data-i18n-placeholder="field_password_min_placeholder" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
              <button type="button" class="input-action" data-password-toggle="reset-new-password" data-icon="eye"></button>
            </div>
            <div class="password-strength">
              <div class="password-strength-bar"><div class="password-strength-fill" id="reset-strength-bar"></div></div>
              <div class="password-strength-text" id="reset-strength-text"></div>
            </div>
            <span class="form-error hidden" id="reset-new-password-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="field_confirm_password">Confirmar senha</label>
            <div class="input-group">
              <input type="password" class="form-input" id="reset-confirm-password"
                data-i18n-placeholder="field_confirm_password_placeholder" placeholder="Repita a senha" autocomplete="new-password">
              <button type="button" class="input-action" data-password-toggle="reset-confirm-password" data-icon="eye"></button>
            </div>
            <span class="form-error hidden" id="reset-confirm-password-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-full" id="btn-reset-password" data-i18n="btn_set_new_password">
            Salvar nova senha
          </button>
        </form>
      </div>
    </div>

    <div class="login-footer animate-up" style="animation-delay:.15s">
      <div data-i18n="developed_by">Desenvolvido por</div>
      <a href="https://onpublimarketing.com.br" target="_blank" rel="noopener">Onpubli Marketing</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
(function() {
  const s = DH.data.settings.get();
  DH.state.theme    = s.theme;
  DH.state.language = s.language;
  DH.ui.initTheme();
  DH.i18n.init();
  DH.i18n.applyTranslations();
  DH.icons.mount();
  DH.ui.initLanguageSelectors();
  document.querySelectorAll('[data-lang-select]').forEach(el => el.value = s.language);
  DH.auth.initPasswordToggles();
  DH.auth.updateStrengthBar('reset-new-password', 'reset-strength-bar', 'reset-strength-text');

  const form = document.getElementById('reset-password-form');
  const invalidBox = document.getElementById('reset-invalid');

  let recoveryReady = false;
  DH.sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });

  // If the recovery link's tokens are already in the URL, getSession()
  // resolves once Supabase has parsed them into a real (recovery) session.
  DH.sb.auth.getSession().then(({ data }) => {
    if (data.session) recoveryReady = true;
    else {
      // Give onAuthStateChange a brief moment before declaring the link invalid.
      setTimeout(() => {
        if (!recoveryReady) {
          form.classList.add('hidden');
          invalidBox.classList.remove('hidden');
        }
      }, 1500);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    DH.auth.clearAllErrors();
    const pwd     = document.getElementById('reset-new-password').value;
    const confirm = document.getElementById('reset-confirm-password').value;

    let valid = true;
    if (!pwd) { DH.auth.showError('reset-new-password', DH.i18n.t('err_required')); valid = false; }
    else if (pwd.length < 6) { DH.auth.showError('reset-new-password', DH.i18n.t('err_password_min')); valid = false; }
    if (pwd !== confirm) { DH.auth.showError('reset-confirm-password', DH.i18n.t('err_passwords_match')); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('btn-reset-password');
    btn.disabled = true;
    const { error } = await DH.sb.auth.updateUser({ password: pwd });
    btn.disabled = false;

    if (error) {
      form.classList.add('hidden');
      invalidBox.classList.remove('hidden');
      return;
    }

    DH.ui.showToast(DH.i18n.t('toast_password_set'), 'success');
    await DH.sb.auth.signOut();
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  });
})();
</script>
</body>
</html>
