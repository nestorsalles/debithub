<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- This page is served at /credor/<slug>/<public_code> — two levels deep —
       so every relative css/js/img reference below would otherwise resolve
       against that fake path instead of the site root. <base> fixes all of
       them at once instead of rewriting every single reference to absolute. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DebitHub — Extrato de débitos do credor.">
  <title>Extrato — DebitHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>
<body>

<div id="toast-container"></div>

<div class="credor-page">

  <!-- Header -->
  <header class="credor-header">
    <a href="index" class="header-brand" style="text-decoration:none;">
      <div class="brand-logo-full brand-logo-full-sm" role="img" aria-label="DebitHub">
        <img class="brand-logo-img-light" src="img/logo-debithub-horizontal-claro.png" alt="">
        <img class="brand-logo-img-dark" src="img/logo-debithub-horizontal-escuro.png" alt="">
      </div>
    </a>

    <div style="display:flex;align-items:center;gap:.6rem;">
      <select class="toolbar-select" data-lang-select>
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
      <button class="toggle-theme-btn" onclick="DH.ui.toggleTheme()" data-icon="sun"></button>
    </div>
  </header>

  <!-- Hero -->
  <div class="credor-hero">
    <div class="credor-hero-avatar" id="hero-avatar">?</div>
    <div class="credor-hero-name" id="hero-name">Carregando...</div>
    <div class="credor-hero-sub"  id="hero-sub"></div>
    <div class="text-muted text-small" style="margin-top:.5rem;" data-i18n="pub_subtitle">
      Veja o que está sendo devido a você
    </div>
  </div>

  <!-- Content -->
  <div class="credor-main" id="credor-content">
    <div style="display:flex;align-items:center;justify-content:center;padding:3rem;">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Platform promo (discreet) -->
  <div class="credor-promo" id="credor-promo" style="display:none;">
    <span data-icon="wallet"></span>
    <span id="credor-promo-text"></span>
    <a href="landing" class="credor-promo-link">
      <span id="credor-promo-cta"></span> <span data-icon="arrow-right"></span>
    </a>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <div data-i18n="developed_by">Desenvolvido por</div>
    <a href="https://onpublimarketing.com.br" target="_blank" rel="noopener">Onpubli Marketing</a>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/icons.js"></script>
<script src="js/date-field.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/credor-view.js"></script>

<script>
(async function() {
  // Load settings (theme/language are still a local device preference)
  const s = DH.data.settings.get();
  DH.state.theme    = s.theme;
  DH.state.language = s.language;

  DH.ui.initTheme();
  DH.i18n.init();
  DH.i18n.applyTranslations();
  DH.icons.mount();
  DH.ui.initLanguageSelectors();

  document.querySelectorAll('[data-lang-select]').forEach(el => el.value = s.language);

  // Update hero avatar with initials after the credor's data has loaded
  function syncAvatar() {
    const heroName = document.getElementById('hero-name');
    const heroAvatar = document.getElementById('hero-avatar');
    if (heroAvatar && heroName) heroAvatar.textContent = DH.ui.getInitials(heroName.textContent || '?');
  }

  // Init the public view (fetches the credor by slug from Supabase)
  await DH.credorView.init();
  syncAvatar();

  // Language switcher re-fetches + re-renders the view content
  document.querySelectorAll('[data-lang-select]').forEach(sel => {
    sel.addEventListener('change', async () => { await DH.credorView.init(); syncAvatar(); });
  });
})();
</script>
</body>
</html>
